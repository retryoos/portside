[project]
name = "laytimely-api"
version = "0.1.0"
description = "Laytimely FastAPI backend — turns maritime voyage documents into a demurrage claim packet."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "anthropic",
    "pdfplumber",
    "python-multipart",
    "sqlalchemy>=2",
    # sqlalchemy declares greenlet as optional, but its async engine + Alembic
    # async migrations both require it. Pin explicitly so a fresh venv works.
    "greenlet>=3",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "pyjwt[crypto]>=2",
    "boto3",
    # Excel laytime export (notes/architecture_weeks_5_to_8.md §1.1). Pure
    # Python, no native deps; fits the python:3.12-slim App Runner image.
    "openpyxl>=3.1",
    # Legal citation corpus BM25 search (notes/architecture_weeks_5_to_8.md
    # §1.6). No service, no model; runs in-process.
    "rank-bm25>=0.2",
    # Outbound HTTP for the egress adapter (EUR-Lex CELLAR client). httpx
    # because it has async, retries, and matches the project's async posture.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laytimely_api"]
