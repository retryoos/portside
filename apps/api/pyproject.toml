[project]
name = "portside-api"
version = "0.1.0"
description = "Papership.Ai FastAPI backend — turns maritime voyage documents into a demurrage claim packet."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "anthropic",
    "pdfplumber",
    "python-multipart",
    "sqlalchemy>=2",
    # sqlalchemy declares greenlet as optional, but its async engine + Alembic
    # async migrations both require it. Pin explicitly so a fresh venv works.
    "greenlet>=3",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "pyjwt[crypto]>=2",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portside_api"]
